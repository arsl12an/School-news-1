<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع المدرسة</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط علوي -->
    <header>
        <h1>🏫مدرسة الشروق</h1>
        <p>مرحباً بكم في الموقع الرسمي للمدرسة</p>
    </header>

    <!-- القائمة -->
    <nav>
        <a href="#">الرئيسية</a>
        <a href="#">الأخبار</a>
        <a href="#">الكادر</a>
        <a href="#">الجداول</a>
        <a href="#">تواصل</a>
    </nav>

    <!-- قسم الأخبار -->
    <section class="box">
        <h2>آخر الأخبار</h2>

        <p id="newsText">
            يبدأ الدوام الرسمي يوم الأحد.
        </p>

        <button onclick="changeNews()">
            خبر جديد
        </button>
    </section>

    <!-- قسم عن المدرسة -->
    <section class="box">
        <h2>عن المدرسة</h2>
        <p>
            تهدف المدرسة إلى توفير بيئة تعليمية متميزة للطلاب.
        </p>
    </section>

    <script src="script.js"></script>

</body>
</html>
